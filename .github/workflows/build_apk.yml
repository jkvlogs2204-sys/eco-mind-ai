name: Build EcoMind AI Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Java
        run: |
          flutter --version
          java -version

      - name: Prepare Flutter Mobile Project
        run: |
          cd mobile
          flutter create . --org com.ecomind --project-name ecomind_mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoMind-AI-Mobile-v1.0.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
