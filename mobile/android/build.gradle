buildscript {
    ext.kotlin_version = '1.9.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Subproject namespace patch for legacy packages (flutter_bluetooth_serial)
subprojects { subproject ->
    subproject.pluginManager.withPlugin('com.android.library') {
        try {
            if (subproject.android.namespace == null) {
                subproject.android.namespace = "com.ecomind.${subproject.name.replace('-', '_')}"
            }
        } catch (Exception ignored) {}
    }
    subproject.pluginManager.withPlugin('com.android.application') {
        try {
            if (subproject.android.namespace == null) {
                subproject.android.namespace = "com.ecomind.${subproject.name.replace('-', '_')}"
            }
        } catch (Exception ignored) {}
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
