buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Ensure legacy subprojects (like flutter_bluetooth_serial) get correct namespace
subprojects { subproject ->
    subproject.pluginManager.withPlugin('com.android.library') {
        try {
            if (subproject.name.contains('flutter_bluetooth_serial')) {
                subproject.android.namespace = 'io.github.edufolly.flutterbluetoothserial'
            } else if (subproject.android.namespace == null) {
                subproject.android.namespace = "com.ecomind.${subproject.name.replace('-', '_')}"
            }
        } catch (Exception ignored) {}
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
